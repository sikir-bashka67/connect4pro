<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect4Pro</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#182230}header{background:#172033;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}nav button{margin:4px;padding:9px 12px;border:0;border-radius:8px;cursor:pointer}main{padding:28px 6%;max-width:1200px;margin:auto}.hero{background:white;padding:28px;border-radius:16px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}.muted{color:#697586}input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box;border:1px solid #ccd3df;border-radius:8px}button.primary{background:#315efb;color:white}.hidden{display:none}.pill{display:inline-block;padding:5px 8px;background:#eef2ff;border-radius:99px;font-size:12px}</style></head>
<body><header><b>Connect4Pro</b><nav><button onclick="show('home')">Главная</button><button onclick="show('ads')">Объявления</button><button onclick="show('financing')">Финансирование</button><button onclick="show('providers')">Провайдеры</button><button onclick="show('events')">Мероприятия</button><button onclick="show('forum')">Форум</button><button onclick="show('calculator')">Калькулятор</button><button onclick="show('account')">Аккаунт</button></nav></header>
<main>
<section id="home" class="page"><div class="hero"><h1>Возможности для бизнеса в одном месте</h1><p>Гранты, инвестиции, провайдеры услуг, мероприятия, объявления и бизнес-сообщество.</p><button class="primary" onclick="show('ads')">Смотреть объявления</button></div><div class="grid" id="homeCards"></div></section>
<section id="ads" class="page hidden"><h2>Объявления</h2><div id="adsList" class="grid"></div></section>
<section id="financing" class="page hidden"><h2>Гранты и инвестиции</h2><div id="financingList" class="grid"></div></section>
<section id="providers" class="page hidden"><h2>Провайдеры</h2><div id="providersList" class="grid"></div></section>
<section id="events" class="page hidden"><h2>Мероприятия</h2><div id="eventsList" class="grid"></div></section>
<section id="forum" class="page hidden"><h2>Форум</h2><div id="forumList" class="grid"></div><div class="card"><h3>Новая тема</h3><input id="topicTitle" placeholder="Название темы"><select id="topicType"><option value="general">Общие вопросы</option><option value="grants">Гранты</option><option value="investments">Инвестиции</option><option value="business_sale">Купля-продажа бизнеса</option><option value="legal">Юридические вопросы</option></select><button class="primary" onclick="createTopic()">Создать</button></div></section>
<section id="calculator" class="page hidden"><h2>Калькулятор вероятности</h2><div class="card"><label>Оборот</label><select id="turnover"><option value="up_to_100k">до 100 000</option><option value="up_to_500k">до 500 000</option><option value="up_to_1m">до 1 млн</option><option value="up_to_5m">до 5 млн</option><option value="up_to_10m">до 10 млн</option><option value="over_10m">более 10 млн</option></select><label>Сотрудники</label><input id="employees" type="number" value="5"><label>Сектор</label><input id="sector" placeholder="IT, сельское хозяйство..."><button class="primary" onclick="calculate()">Рассчитать</button><div id="calcResult"></div></div></section>
<section id="account" class="page hidden"><h2>Аккаунт</h2><div class="card" id="accountBox"></div><div class="card"><h3>Вход</h3><input id="loginUser" placeholder="username"><input id="loginPass" type="password" placeholder="Пароль"><button class="primary" onclick="login()">Войти</button></div><div class="card"><h3>Регистрация</h3><input id="regUser" placeholder="username"><input id="regEmail" placeholder="email"><input id="regPass" type="password" placeholder="Пароль"><select id="regRole"><option value="client">Клиент</option><option value="provider">Провайдер</option></select><button class="primary" onclick="register()">Создать аккаунт</button></div></section>
</main>
<script>const api='/api';let token=localStorage.getItem('token');const auth=()=>token?{Authorization:'Bearer '+token}:{};async function get(p){let r=await fetch(api+p,{headers:auth()});return r.ok?r.json():[]}async function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='ads')loadAds();if(id==='financing')loadFinancing();if(id==='providers')loadProviders();if(id==='events')loadEvents();if(id==='forum')loadForum();if(id==='account')loadAccount()}async function loadAds(){let a=await get('/ads/');document.getElementById('adsList').innerHTML=(a.results||a).map(x=>`<div class="card"><span class="pill">Запрос</span><h3>${x.title}</h3><p>${x.description}</p><b>${x.price}</b></div>`).join('')||'<p>Пока нет объявлений.</p>'}async function loadFinancing(){let a=await get('/financing/');document.getElementById('financingList').innerHTML=(a.results||a).map(x=>`<div class="card"><span class="pill">${x.financing_type}</span><h3>${x.title}</h3><p>${x.description}</p><p>${x.amount_description}</p><small>Дедлайн: ${x.deadline||'—'}</small></div>`).join('')||'<p>Пока нет программ.</p>'}async function loadProviders(){let a=await get('/provider-profiles/');document.getElementById('providersList').innerHTML=(a.results||a).map(x=>`<div class="card"><h3>${x.company_name}</h3><p>${x.activity}</p><p>${x.description}</p><p class="muted">${x.services_description}</p></div>`).join('')||'<p>Пока нет провайдеров.</p>'}async function loadEvents(){let a=await get('/events/');document.getElementById('eventsList').innerHTML=(a.results||a).map(x=>`<div class="card"><span class="pill">${x.event_type}</span><h3>${x.title}</h3><p>${x.description}</p><p>${x.date_and_time} · ${x.format}</p></div>`).join('')||'<p>Пока нет мероприятий.</p>'}async function loadForum(){let a=await get('/forum/topics/');document.getElementById('forumList').innerHTML=(a.results||a).map(x=>`<div class="card"><h3>${x.title}</h3><p>${x.topic_type} · ${x.author_name}</p><small>${x.created_at}</small></div>`).join('')||'<p>Пока нет тем.</p>'}async function createTopic(){if(!token)return alert('Сначала войдите.');let r=await fetch(api+'/forum/topics/',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({title:topicTitle.value,topic_type:topicType.value})});if(r.ok){topicTitle.value='';loadForum()}else alert('Не удалось создать тему.')}async function calculate(){let r=await fetch(api+'/calculator/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({annual_turnover:turnover.value,employees_count:employees.value,sector:sector.value})});let x=await r.json();calcResult.innerHTML=`<h3>${x.calculated_probability_percent}%</h3><p>${x.recommendation}</p>`}async function login(){let r=await fetch('/api/token/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUser.value,password:loginPass.value})});let x=await r.json();if(x.access){token=x.access;localStorage.setItem('token',token);loadAccount();alert('Вход выполнен')}else alert(x.detail||'Ошибка входа')}async function register(){let r=await fetch(api+'/register/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:regUser.value,email:regEmail.value,password:regPass.value,role:regRole.value})});let x=await r.json();if(r.ok){alert('Аккаунт создан. Теперь войдите.')}else alert(JSON.stringify(x))}async function loadAccount(){if(!token){accountBox.innerHTML='<p>Вы не вошли.</p>';return}let x=await get('/me/');accountBox.innerHTML=`<h3>${x.username}</h3><p>${x.first_name||''} ${x.last_name||''}</p><p>Роль: ${x.role} · Подписка: ${x.subscription}</p><button onclick="logout()">Выйти</button>`}function logout(){token=null;localStorage.removeItem('token');loadAccount()}show('home');get('/ads/').then(a=>{homeCards.innerHTML=`<div class="card"><h3>${(a.results||a).length}</h3><p>объявлений</p></div>`});</script></body></html>
